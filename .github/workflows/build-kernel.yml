name: Build Linux Kernel with Localmodconfig
on: 
  workflow_dispatch:  # Manual trigger
    inputs:
      instance-type:
        description: 'Instance type used for localmodconfig (must match extract workflow)'
        required: false
        default: 'm7i.metal-24xl'
        type: string
      image-type:
        description: 'Image type used for localmodconfig (must match extract workflow)'
        required: false
        default: 'ubuntu-24.04'
        type: string
      build-type:
        description: 'Build type (localmod, defconfig, or tinyconfig)'
        required: false
        default: 'localmod'
        type: choice
        options:
        - localmod
        - defconfig
        - tinyconfig
      enable-debug:
        description: 'Enable debug features (slower build)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  build-kernel:
    name: Build Linux Kernel
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Verify system info
        run: |
          echo "🚀 LINUX KERNEL BUILD WITH LOCALMODCONFIG"
          echo "================================================"
          echo ""
          echo "📍 Target instance: ${{ inputs.instance-type || 'm7i.metal-24xl' }}"
          echo "📍 Target image: ${{ inputs.image-type || 'ubuntu-24.04' }}"
          echo "📍 Build type: ${{ inputs.build-type || 'localmod' }}"
          echo "📍 Debug features: ${{ inputs.enable-debug || 'false' }}"
          echo "📍 Runner CPUs: $(nproc)"
          echo "📍 Available RAM: $(free -h | grep Mem: | awk '{print $2}')"
          echo "📍 Available disk: $(df -h / | tail -1 | awk '{print $4}')"
          echo "⏰ Build started: $(date)"
          echo ""

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          # Don't need full history for builds
          fetch-depth: 1

      - name: Cache and install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential ccache bc kmod cpio flex bison libelf-dev libssl-dev dwarves zstd
          version: 1.0

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-build-${{ inputs.build-type || 'localmod' }}-${{ github.sha }}
          restore-keys: |
            kernel-build-${{ inputs.build-type || 'localmod' }}-
            kernel-build-
          max-size: 8G
          verbose: 2

      - name: Configure ccache for kernel builds
        run: |
          echo "🔧 Configuring ccache for optimal kernel builds..."
          # Avoid cache misses from build timestamps
          echo "KBUILD_BUILD_TIMESTAMP=" >> $GITHUB_ENV
          echo "CC=ccache gcc" >> $GITHUB_ENV
          # Enable compression for better cache efficiency
          echo "CCACHE_COMPRESS=true" >> $GITHUB_ENV
          echo "CCACHE_COMPRESSLEVEL=6" >> $GITHUB_ENV
          # Show ccache stats
          ccache -s
          ccache -z  # Zero stats for this build

      - name: Find latest extract workflow run
        if: inputs.build-type == 'localmod' || !inputs.build-type
        id: find-extract-run
        run: |
          echo "🔍 Finding latest extract workflow run with localmodconfig for ${{ inputs.instance-type || 'm7i.metal-24xl' }}-${{ inputs.image-type || 'ubuntu-24.04' }}..."
          
          # Get the latest successful extract workflow run that has our specific artifact
          EXTRACT_RUN_ID=$(gh api repos/yonch/linux/actions/workflows/extract-kernel-config.yml/runs \
            --jq '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | .id' \
            | head -1)
          
          if [ -z "$EXTRACT_RUN_ID" ]; then
            echo "❌ No successful extract workflow runs found"
            echo "Please run the extract-kernel-config workflow first to generate localmodconfig"
            exit 1
          fi
          
          echo "✅ Found extract workflow run: $EXTRACT_RUN_ID"
          echo "extract_run_id=$EXTRACT_RUN_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download localmodconfig artifact
        if: inputs.build-type == 'localmod' || !inputs.build-type
        uses: dawidd6/action-download-artifact@v6
        with:
          name: localmod-config-${{ inputs.instance-type || 'm7i.metal-24xl' }}-${{ inputs.image-type || 'ubuntu-24.04' }}
          path: ./localmod-artifacts/
          run_id: ${{ steps.find-extract-run.outputs.extract_run_id }}
          github_token: ${{ github.token }}
        
      - name: Extract and prepare localmodconfig
        if: inputs.build-type == 'localmod' || !inputs.build-type
        run: |
          echo "🔍 Extracting localmodconfig artifact..."
          if [ -f "./localmod-artifacts/localmod-config.tar.gz" ]; then
            cd localmod-artifacts
            tar -xzf localmod-config.tar.gz
            if [ -f "localmod-config/current-config" ]; then
              echo "✅ Found localmodconfig base configuration"
              cp localmod-config/current-config ../.config
              echo "📋 Module information available:"
              if [ -f "localmod-config/loaded-module-names.txt" ]; then
                echo "  - Loaded modules: $(wc -l < localmod-config/loaded-module-names.txt)"
                echo "  - Instance summary available: $([ -f localmod-config/instance-summary.txt ] && echo 'Yes' || echo 'No')"
              fi
              cd ..
            else
              echo "❌ Localmodconfig artifact incomplete - missing current-config file"
              echo "The artifact exists but doesn't contain the required configuration."
              echo "Please re-run the extract-kernel-config workflow to generate a proper localmodconfig."
              exit 1
            fi
          else
            echo "❌ Localmodconfig artifact not found"
            echo "For localmod build type, you must first run the extract-kernel-config workflow"
            echo "to generate localmodconfig for instance type: ${{ inputs.instance-type || 'm7i.metal-24xl' }}"
            echo "and image type: ${{ inputs.image-type || 'ubuntu-24.04' }}"
            exit 1
          fi

      - name: Configure kernel
        run: |
          echo "🔧 Configuring kernel build..."
          
          # Determine which config to use
          if [ "${{ inputs.build-type }}" = "tinyconfig" ]; then
            echo "Using tinyconfig (minimal kernel)"
            make tinyconfig
          elif [ "${{ inputs.build-type }}" = "defconfig" ]; then
            echo "Using defconfig (default kernel config)"
            make defconfig
          else
            echo "Using localmodconfig (optimized for target hardware)"
            # At this point .config should exist from the extraction step
            if [ ! -f ".config" ]; then
              echo "❌ ERROR: No .config file found after localmodconfig extraction"
              exit 1
            fi
            # Resolve any missing dependencies
            KBUILD_BUILD_TIMESTAMP='' make CC="ccache gcc" olddefconfig
          fi

          # Apply build optimizations
          echo "🚀 Applying build optimizations..."
          
          # Enable CONFIG_TRIM_UNUSED_KSYMS for 9-29% build speedup
          scripts/config --enable CONFIG_TRIM_UNUSED_KSYMS
          
          # Disable expensive debug features unless specifically requested
          if [ "${{ inputs.enable-debug }}" != "true" ]; then
            echo "Disabling debug features for faster builds..."
            scripts/config --disable CONFIG_DEBUG_INFO
            scripts/config --disable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
            scripts/config --disable CONFIG_DEBUG_KERNEL
            scripts/config --disable CONFIG_DEBUG_MISC
            scripts/config --disable CONFIG_DEBUG_VM
            scripts/config --disable CONFIG_DEBUG_PAGEALLOC
            scripts/config --disable CONFIG_DEBUG_SLUB
            scripts/config --disable CONFIG_LOCKDEP
            scripts/config --disable CONFIG_PROVE_LOCKING
            scripts/config --disable CONFIG_DEBUG_LOCK_ALLOC
          fi
          
          # Optimize for size (can improve compilation speed)
          scripts/config --enable CONFIG_CC_OPTIMIZE_FOR_SIZE
          
          # Ensure we have module support for easier testing
          scripts/config --enable CONFIG_MODULES
          scripts/config --enable CONFIG_MODULE_UNLOAD
          
          # Apply final configuration resolution
          KBUILD_BUILD_TIMESTAMP='' make CC="ccache gcc" olddefconfig
          
          # Show final configuration summary
          echo "📋 Final kernel configuration:"
          echo "  - Kernel version: $(KBUILD_BUILD_TIMESTAMP='' make CC=\"ccache gcc\" kernelrelease)"
          echo "  - Modules enabled: $(grep -c "=m$" .config || echo 0)"
          echo "  - Built-in features: $(grep -c "=y$" .config || echo 0)"
          echo "  - Debug features: $(grep -c "CONFIG_DEBUG.*=y$" .config || echo 0)"

      - name: Build kernel
        run: |
          echo "🔨 Starting kernel build..."
          echo "Using $(nproc) CPU cores for parallel compilation"
          
          # Start time tracking
          START_TIME=$(date +%s)
          
          # Build with optimal parallelism (cores + 1)
          KBUILD_BUILD_TIMESTAMP='' make CC="ccache gcc" -j$(($(nproc) + 1)) 2>&1 | tee build.log
          
          # Calculate build time
          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))
          echo "⏰ Build completed in ${BUILD_TIME} seconds ($((BUILD_TIME / 60))m $((BUILD_TIME % 60))s)"
          
          # Show ccache statistics
          echo "📊 ccache statistics:"
          ccache -s

      - name: Build modules
        run: |
          echo "🔧 Building kernel modules..."
          START_TIME=$(date +%s)
          
          KBUILD_BUILD_TIMESTAMP='' make CC="ccache gcc" -j$(($(nproc) + 1)) modules 2>&1 | tee -a build.log
          
          END_TIME=$(date +%s)
          MODULE_TIME=$((END_TIME - START_TIME))
          echo "⏰ Module build completed in ${MODULE_TIME} seconds ($((MODULE_TIME / 60))m $((MODULE_TIME % 60))s)"

      - name: Prepare kernel artifacts
        run: |
          echo "📦 Preparing kernel artifacts..."
          mkdir -p artifacts
          
          # Copy main kernel files
          if [ -f "arch/x86/boot/bzImage" ]; then
            cp arch/x86/boot/bzImage artifacts/
            echo "✅ bzImage: $(du -h arch/x86/boot/bzImage | cut -f1)"
          fi
          
          if [ -f "vmlinux" ]; then
            cp vmlinux artifacts/
            echo "✅ vmlinux: $(du -h vmlinux | cut -f1)"
          fi
          
          if [ -f "System.map" ]; then
            cp System.map artifacts/
            echo "✅ System.map: $(du -h System.map | cut -f1)"
          fi
          
          # Copy kernel config
          cp .config artifacts/kernel-config
          
          # Create modules archive if modules were built
          if [ "$(find . -name "*.ko" | wc -l)" -gt 0 ]; then
            echo "📦 Creating modules archive..."
            find . -name "*.ko" -exec cp --parents {} artifacts/ \;
            MODULE_COUNT=$(find artifacts -name "*.ko" | wc -l)
            echo "✅ Modules archived: $MODULE_COUNT"
          fi
          
          # Create build summary
          cat > artifacts/build-summary.txt << EOF
          Linux Kernel Build Summary
          =========================
          Build Date: $(date)
          Build Type: ${{ inputs.build-type || 'localmod' }}
          Target Instance: ${{ inputs.instance-type || 'm7i.metal-24xl' }}
          Target Image: ${{ inputs.image-type || 'ubuntu-24.04' }}
          Debug Features: ${{ inputs.enable-debug || 'false' }}
          
          Kernel Version: $(KBUILD_BUILD_TIMESTAMP='' make CC=\"ccache gcc\" kernelrelease)
          Compiler: $(gcc --version | head -1)
          
          Configuration Stats:
          - Total modules: $(grep -c "=m$" .config || echo 0)
          - Built-in features: $(grep -c "=y$" .config || echo 0)
          - Disabled features: $(grep -c "is not set$" .config || echo 0)
          
          Build Performance:
          - Runner CPUs: $(nproc)
          - Parallel jobs: $(($(nproc) + 1))
          
          ccache Statistics:
          $(ccache -s)
          EOF
          
          # Show artifact summary
          echo "📋 Artifact summary:"
          ls -la artifacts/
          echo ""
          echo "Total artifact size: $(du -sh artifacts | cut -f1)"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-kernel-${{ inputs.build-type || 'localmod' }}-${{ inputs.instance-type || 'm7i.metal-24xl' }}-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          compression-level: 6

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ inputs.build-type || 'localmod' }}-${{ github.sha }}
          path: build.log
          retention-days: 14

      - name: Build completion summary
        run: |
          echo ""
          echo "🎯 KERNEL BUILD COMPLETED SUCCESSFULLY!"
          echo "======================================"
          echo "✅ Kernel version: $(KBUILD_BUILD_TIMESTAMP='' make CC=\"ccache gcc\" kernelrelease)"
          echo "✅ Build type: ${{ inputs.build-type || 'localmod' }}"
          echo "✅ Artifacts uploaded with 14-day retention"
          echo ""
          echo "📦 Artifacts created:"
          echo "  - linux-kernel-${{ inputs.build-type || 'localmod' }}-${{ inputs.instance-type || 'm7i.metal-24xl' }}-${{ github.sha }}"
          echo "  - build-logs-${{ inputs.build-type || 'localmod' }}-${{ github.sha }}"
          echo ""
          echo "💡 Performance optimizations applied:"
          echo "  - ccache for fast incremental builds (6.5x speedup)"
          if [ "${{ inputs.build-type }}" = "localmod" ] || [ ! "${{ inputs.build-type }}" ]; then
            echo "  - localmodconfig for hardware-specific optimization (~35x module reduction)"
          fi
          echo "  - CONFIG_TRIM_UNUSED_KSYMS enabled (9-29% build speedup)"
          echo "  - Debug features disabled for faster compilation"
          echo "  - Parallel compilation with $(($(nproc) + 1)) jobs"
          echo ""
          echo "🚀 To use this kernel:"
          echo "  1. Download the artifacts from GitHub Actions"
          echo "  2. Extract bzImage for bootloader configuration"
          echo "  3. Install modules if needed: make modules_install"
          echo ""
          echo "📊 Final ccache stats:"
          ccache -s