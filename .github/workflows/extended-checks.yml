name: Extended Checks

on:
  workflow_dispatch:
    inputs:
      heavy-tests:
        description: 'Run heavy tests (debug/lockdep builds, etc.)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  clang-defconfig-w1:
    name: Clang/LLVM defconfig W=1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install clang/llvm and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld build-essential bc kmod cpio flex bison libelf-dev libssl-dev dwarves ccache
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-extended-clang-defconfig-${{ runner.os }}-${{ github.ref }}
          max-size: 8G
      - name: Build with clang
        continue-on-error: true
        run: |
          BUILD_DIR="/tmp/ci-clang"
          make LLVM=1 CC="ccache clang" O="$BUILD_DIR" defconfig
          # Force-enable resctrl on x86 so fs/resctrl/pmu.c is built
          scripts/config --file "$BUILD_DIR/.config" --enable CONFIG_X86_CPU_RESCTRL
          scripts/config --file "$BUILD_DIR/.config" --enable CONFIG_MISC_FILESYSTEMS || true
          scripts/config --file "$BUILD_DIR/.config" --enable CONFIG_PROC_FS || true
          make LLVM=1 CC="ccache clang" O="$BUILD_DIR" olddefconfig
          make LLVM=1 CC="ccache clang" O="$BUILD_DIR" -j$(nproc) W=1 bzImage 2>&1 | tee clang-warnings.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clang-defconfig-w1-${{ github.sha }}
          path: |
            clang-warnings.log
            /tmp/ci-clang/.config

  config-spread:
    name: Config spread (allno/allmod/COMPILE_TEST)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libelf-dev libssl-dev dwarves ccache
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-extended-config-spread-${{ runner.os }}-${{ github.ref }}
          max-size: 8G
      - name: allnoconfig
        run: |
          BUILD_DIR="/tmp/ci-allno"
          make O="$BUILD_DIR" allnoconfig
          make O="$BUILD_DIR" -j$(nproc) CC="ccache gcc" 2>&1 | tee allno.log || true
      - name: allmodconfig
        run: |
          BUILD_DIR="/tmp/ci-allmod"
          make O="$BUILD_DIR" allmodconfig
          make O="$BUILD_DIR" -j$(nproc) CC="ccache gcc" 2>&1 | tee allmod.log || true
      - name: defconfig + COMPILE_TEST
        run: |
          BUILD_DIR="/tmp/ci-compiletest"
          make O="$BUILD_DIR" defconfig
          scripts/config --file "$BUILD_DIR/.config" --enable CONFIG_COMPILE_TEST
          # Ensure resctrl is covered in this build
          scripts/config --file "$BUILD_DIR/.config" --enable CONFIG_X86_CPU_RESCTRL || true
          scripts/config --file "$BUILD_DIR/.config" --enable CONFIG_MISC_FILESYSTEMS || true
          scripts/config --file "$BUILD_DIR/.config" --enable CONFIG_PROC_FS || true
          make O="$BUILD_DIR" olddefconfig
          make O="$BUILD_DIR" -j$(nproc) CC="ccache gcc" 2>&1 | tee compiletest.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: config-spread-${{ github.sha }}
          path: |
            allno.log
            allmod.log
            compiletest.log

  kconfig-toggles:
    name: Kconfig toggles (one-at-a-time)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        symbol: [CONFIG_SMP, CONFIG_PREEMPT, CONFIG_SYSFS, CONFIG_PROC_FS]
        value: [y, n]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libelf-dev libssl-dev dwarves ccache
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-extended-toggle-${{ matrix.symbol }}-${{ matrix.value }}-${{ runner.os }}-${{ github.ref }}
          max-size: 8G
      - name: Build toggle
        run: |
          BUILD_DIR="/tmp/ci-toggle"
          make O="$BUILD_DIR" defconfig
          # Keep resctrl enabled while toggling other symbols
          scripts/config --file "$BUILD_DIR/.config" --enable CONFIG_X86_CPU_RESCTRL || true
          scripts/config --file "$BUILD_DIR/.config" --enable CONFIG_MISC_FILESYSTEMS || true
          scripts/config --file "$BUILD_DIR/.config" --enable CONFIG_PROC_FS || true
          scripts/config --file "$BUILD_DIR/.config" --set-val ${{ matrix.symbol }} ${{ matrix.value }}
          make O="$BUILD_DIR" olddefconfig
          make O="$BUILD_DIR" -j$(nproc) CC="ccache gcc" 2>&1 | tee "${{ matrix.symbol }}-${{ matrix.value }}.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kconfig-toggle-${{ matrix.symbol }}-${{ matrix.value }}-${{ github.sha }}
          path: "${{ matrix.symbol }}-${{ matrix.value }}.log"

  kconfig-net-inet:
    name: Kconfig NET=y, INET=n
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libelf-dev libssl-dev dwarves ccache
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-extended-net-inet-${{ runner.os }}-${{ github.ref }}
          max-size: 8G
      - name: Build NET=y, INET=n
        run: |
          BUILD_DIR="/tmp/ci-netinet"
          make O="$BUILD_DIR" defconfig
          scripts/config --file "$BUILD_DIR/.config" --enable CONFIG_X86_CPU_RESCTRL || true
          scripts/config --file "$BUILD_DIR/.config" --enable CONFIG_MISC_FILESYSTEMS || true
          scripts/config --file "$BUILD_DIR/.config" --enable CONFIG_PROC_FS || true
          scripts/config --file "$BUILD_DIR/.config" --set-val CONFIG_NET y
          scripts/config --file "$BUILD_DIR/.config" --set-val CONFIG_INET n
          make O="$BUILD_DIR" olddefconfig
          make O="$BUILD_DIR" -j$(nproc) CC="ccache gcc" 2>&1 | tee net-inet.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kconfig-net-inet-${{ github.sha }}
          path: net-inet.log

  cross-compile-arm64:
    name: Cross-compile arm64 defconfig
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install aarch64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc flex bison libelf-dev libssl-dev dwarves ccache
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-extended-arm64-defconfig-${{ runner.os }}-${{ github.ref }}
          max-size: 8G
      - name: Build
        run: |
          BUILD_DIR="/tmp/ci-arm64"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache aarch64-linux-gnu-gcc" O="$BUILD_DIR" defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache aarch64-linux-gnu-gcc" O="$BUILD_DIR" -j$(nproc) 2>&1 | tee arm64.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-compile-arm64-${{ github.sha }}
          path: arm64.log

  linux-next-rebase-build:
    name: linux-next integration (apply and build)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libelf-dev libssl-dev dwarves ccache
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-extended-linux-next-${{ runner.os }}-${{ github.ref }}
          max-size: 8G
      - name: Fetch linux-next and compute relevant base
        id: base
        run: |
          set -euo pipefail
          chmod +x .github/workflows/find-relevant-base.sh || true
          git remote add linux-next https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git || true
          git fetch --no-tags linux-next linux-next/master:refs/remotes/linux-next/master
          BASE=$(.github/workflows/find-relevant-base.sh linux-next/master)
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "Relevant base: $BASE"
          echo "Commits to apply:"
          git rev-list --oneline "$BASE"..HEAD || true
      - name: Create patch series (relevant commits only)
        id: mkpatch
        run: |
          set -euo pipefail
          BASE="${{ steps.base.outputs.base }}"
          mkdir -p /tmp/ln-patches
          git format-patch -o /tmp/ln-patches "$BASE"..HEAD
          COUNT=$(ls /tmp/ln-patches/*.patch 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Created $COUNT patches"
      - name: Apply patches to linux-next
        id: apply
        run: |
          set -euo pipefail
          APPLY_STATUS=0
          COUNT="${{ steps.mkpatch.outputs.count }}"
          git checkout -B linux-next-try linux-next/master
          if [ "$COUNT" = "0" ]; then
            echo "No relevant patches to apply; skipping git am"
          else
            # Apply with three-way merge; capture status for upload step
            git am -3 /tmp/ln-patches/*.patch 2>&1 | tee /tmp/linux-next-apply.log || APPLY_STATUS=$?
          fi
          echo "apply_status=$APPLY_STATUS" >> $GITHUB_OUTPUT
          exit 0
      - name: Build on linux-next (defconfig, W=1)
        id: build
        if: steps.apply.outputs.apply_status == '0'
        run: |
          set -euo pipefail
          BUILD_DIR="/tmp/ln-build"
          make O="$BUILD_DIR" defconfig
          scripts/config --file "$BUILD_DIR/.config" --enable CONFIG_X86_CPU_RESCTRL || true
          scripts/config --file "$BUILD_DIR/.config" --enable CONFIG_MISC_FILESYSTEMS || true
          scripts/config --file "$BUILD_DIR/.config" --enable CONFIG_PROC_FS || true
          make O="$BUILD_DIR" olddefconfig
          BUILD_STATUS=0
          make O="$BUILD_DIR" -j$(nproc) CC="ccache gcc" W=1 bzImage 2>&1 | tee /tmp/linux-next-build.log || BUILD_STATUS=$?
          echo "build_status=$BUILD_STATUS" >> $GITHUB_OUTPUT
          exit 0
      - name: Upload linux-next rebase artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-next-rebase-${{ github.sha }}
          path: |
            /tmp/ln-patches
            /tmp/linux-next-apply.log
            /tmp/linux-next-build.log
          if-no-files-found: ignore
      - name: Fail if apply or build failed
        if: |
          steps.apply.outputs.apply_status != '0' ||
          (steps.build.outcome == 'success' && steps.build.outputs.build_status != '0') ||
          steps.build.outcome == 'failure'
        run: |
          echo "Apply status: ${{ steps.apply.outputs.apply_status }}"
          echo "Build status:  ${{ steps.build.outputs.build_status }}"
          exit 1

  debug-lockdep-build:
    if: inputs.heavy-tests == true
    name: Debug/lockdep config build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libelf-dev libssl-dev dwarves
      - name: Build debug/lockdep variant (compile-only)
        run: |
          BUILD_DIR="/tmp/ci-debug"
          make O="$BUILD_DIR" defconfig
          # Enable a subset of heavy debug knobs
          scripts/config --file "$BUILD_DIR/.config" --enable CONFIG_PREEMPT \
            --enable CONFIG_DEBUG_PREEMPT --enable CONFIG_SLUB_DEBUG \
            --enable CONFIG_DEBUG_PAGEALLOC --enable CONFIG_DEBUG_MUTEXES \
            --enable CONFIG_DEBUG_SPINLOCK --enable CONFIG_DEBUG_ATOMIC_SLEEP \
            --enable CONFIG_PROVE_RCU --enable CONFIG_DEBUG_OBJECTS_RCU_HEAD \
            --enable CONFIG_LOCKDEP
          make O="$BUILD_DIR" olddefconfig
          make O="$BUILD_DIR" -j$(nproc) 2>&1 | tee debug-lockdep.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: debug-lockdep-build-${{ github.sha }}
          path: debug-lockdep.log
