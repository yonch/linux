name: Build and Test Linux Kernel with Resctrl PMU (v2)
on: 
  workflow_dispatch:  # Manual trigger
    inputs:
      instance-type:
        description: 'EC2 instance type for testing'
        required: false
        default: 'm7i.metal-24xl'
        type: string
      build-instance-type:
        description: 'Instance type used for localmodconfig'
        required: false
        default: 'm7i.metal-24xl'
        type: string
      image-type:
        description: 'Image type (ubuntu-22.04 or ubuntu-24.04)'
        required: false
        default: 'ubuntu-24.04'
        type: string
      build-type:
        description: 'Build type (localmod, defconfig, or tinyconfig)'
        required: false
        default: 'localmod'
        type: choice
        options:
        - localmod
        - defconfig
        - tinyconfig
      enable-debug:
        description: 'Enable debug features (slower build)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write
  id-token: write # Required for AWS authentication

jobs:
  build-kernel:
    name: Build Linux Kernel
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      release-tag: ${{ steps.release_info.outputs.release_tag }}
      kernel-version: ${{ steps.release_info.outputs.kernel_version }}
    steps:
      - name: Verify system info
        run: |
          echo "🚀 BUILD AND TEST LINUX KERNEL WITH RESCTRL PMU (v2)"
          echo "===================================================="
          echo ""
          echo "📍 Build instance type: ${{ inputs.build-instance-type || 'm7i.metal-24xl' }}"
          echo "📍 Test instance type: ${{ inputs.instance-type || 'm7i.metal-24xl' }}"
          echo "📍 Target image: ${{ inputs.image-type || 'ubuntu-24.04' }}"
          echo "📍 Build type: ${{ inputs.build-type || 'localmod' }}"
          echo "📍 Debug features: ${{ inputs.enable-debug || 'false' }}"
          echo "📍 Runner CPUs: $(nproc)"
          echo "📍 Available RAM: $(free -h | grep Mem: | awk '{print $2}')"
          echo "📍 Available disk: $(df -h / | tail -1 | awk '{print $4}')"
          echo "⏰ Build started: $(date)"
          echo ""

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup build directory
        run: |
          echo "🔧 Setting up out-of-tree build directory..."
          BUILD_DIR="/tmp/kernel-build"
          mkdir -p "$BUILD_DIR"
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV
          echo "✅ Build directory created: $BUILD_DIR"
          echo "📍 Source directory: $(pwd)"
          echo "📍 Build directory: $BUILD_DIR"
          echo ""

      - name: Cache and install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential ccache bc kmod cpio flex bison libelf-dev libssl-dev dwarves zstd dracut-core
          version: 1.0

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ inputs.build-type || 'localmod' }}
          max-size: 8G
          verbose: 2

      - name: Configure ccache for kernel builds
        run: |
          echo "🔧 Configuring ccache for optimal kernel builds..."
          echo "KBUILD_BUILD_TIMESTAMP=" >> $GITHUB_ENV
          echo "CC=ccache gcc" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=true" >> $GITHUB_ENV
          echo "CCACHE_COMPRESSLEVEL=6" >> $GITHUB_ENV
          ccache -s
          ccache -z

      - name: Generate config hash for caching
        id: config-hash
        run: |
          echo "📊 Generating configuration hash for cache key..."
          CONFIG_HASH="none"
          # Config might not exist yet if this runs before extraction
          # Will be in build directory after extraction step
          if [ -f "$BUILD_DIR/.config" ]; then
            CONFIG_HASH=$(sha256sum "$BUILD_DIR/.config" | cut -d' ' -f1 | cut -c1-16)
            echo "✅ Config hash from build dir: $CONFIG_HASH"
          else
            echo "⚠️ No config yet in build directory, using 'pending' hash"
            CONFIG_HASH="pending"
          fi
          echo "config-hash=$CONFIG_HASH" >> $GITHUB_OUTPUT

      - name: Cache build directory
        id: cache-build
        uses: actions/cache@v4
        with:
          path: /tmp/kernel-build
          key: kernel-build-v2-${{ github.sha }}-${{ inputs.build-type || 'localmod' }}-${{ steps.config-hash.outputs.config-hash }}
          restore-keys: |
            kernel-build-v2-${{ github.sha }}-${{ inputs.build-type || 'localmod' }}-
            kernel-build-v2-${{ github.sha }}-
            kernel-build-v2-

      - name: Report cache status
        run: |
          echo "📊 Cache Status Report"
          echo "====================="
          echo "🔧 ccache statistics (before build):"
          ccache -s | grep -E "cache hit|cache miss|cache size" || true
          echo ""
          echo "📦 Build directory cache:"
          if [ "${{ steps.cache-build.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Cache HIT - using cached build directory"
            echo "🚀 This should significantly speed up the build!"
            if [ -d "$BUILD_DIR" ]; then
              echo "📁 Cached build directory contents:"
              echo "  - Total size: $(du -sh $BUILD_DIR | cut -f1)"
              echo "  - Object files: $(find $BUILD_DIR -name "*.o" 2>/dev/null | wc -l)"
              echo "  - Command files: $(find $BUILD_DIR -name "*.cmd" 2>/dev/null | wc -l)"
            fi
          else
            echo "❌ Cache MISS - starting fresh build"
            echo "📝 Note: First build will populate the cache for future runs"
          fi
          echo ""
          
          if [ -d "$BUILD_DIR/.config" ]; then
            echo "✅ Build directory cache hit - found existing build artifacts"
            ls -la "$BUILD_DIR" | head -10
          else
            echo "🔄 Build directory cache miss - starting fresh build"
          fi

      - name: Find latest extract workflow run
        if: inputs.build-type == 'localmod' || !inputs.build-type
        id: find-extract-run
        run: |
          echo "🔍 Finding latest extract workflow run with localmodconfig for ${{ inputs.build-instance-type || 'm7i.metal-24xl' }}-${{ inputs.image-type || 'ubuntu-24.04' }}..."
          
          EXTRACT_RUN_ID=$(gh api repos/yonch/linux/actions/workflows/extract-kernel-config.yml/runs \
            --jq '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | .id' \
            | head -1)
          
          if [ -z "$EXTRACT_RUN_ID" ]; then
            echo "❌ No successful extract workflow runs found"
            echo "Please run the extract-kernel-config workflow first to generate localmodconfig"
            exit 1
          fi
          
          echo "✅ Found extract workflow run: $EXTRACT_RUN_ID"
          echo "extract_run_id=$EXTRACT_RUN_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download localmodconfig artifact
        if: inputs.build-type == 'localmod' || !inputs.build-type
        uses: dawidd6/action-download-artifact@v6
        with:
          name: localmod-config-${{ inputs.build-instance-type || 'm7i.metal-24xl' }}-${{ inputs.image-type || 'ubuntu-24.04' }}
          path: /tmp/localmod-artifacts/
          run_id: ${{ steps.find-extract-run.outputs.extract_run_id }}
          github_token: ${{ github.token }}
        
      - name: Extract and prepare localmodconfig
        if: inputs.build-type == 'localmod' || !inputs.build-type
        run: |
          echo "🔍 Extracting localmodconfig artifact..."
          echo "Build directory: $BUILD_DIR"
          if [ -f "/tmp/localmod-artifacts/localmod-config.tar.gz" ]; then
            cd /tmp/localmod-artifacts
            tar -xzf localmod-config.tar.gz
            if [ -f "localmod-config/current-config" ]; then
              echo "✅ Found localmodconfig base configuration"
              # Save config to temporary location for processing
              TEMP_CONFIG="/tmp/temp-kernel-config"
              cp localmod-config/current-config "$TEMP_CONFIG"
              echo "TEMP_CONFIG=$TEMP_CONFIG" >> $GITHUB_ENV
              echo "📁 Config staged to: $TEMP_CONFIG"
              echo "📊 Config stats: $(wc -l "$TEMP_CONFIG" | cut -d' ' -f1) lines"
              echo "📋 Module information available:"
              if [ -f "localmod-config/loaded-module-names.txt" ]; then
                echo "  - Loaded modules: $(wc -l < localmod-config/loaded-module-names.txt)"
                echo "  - Instance summary available: $([ -f localmod-config/instance-summary.txt ] && echo 'Yes' || echo 'No')"
              fi
              cd "$GITHUB_WORKSPACE"
            else
              echo "❌ Localmodconfig artifact incomplete - missing current-config file"
              exit 1
            fi
          else
            echo "❌ Localmodconfig artifact not found"
            exit 1
          fi


      - name: Configure kernel
        run: |
          echo "🔧 Configuring kernel build..."
          echo "Build directory: $BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          
          if [ "${{ inputs.build-type }}" = "tinyconfig" ]; then
            echo "Using tinyconfig (minimal kernel)"
            make O="$BUILD_DIR" tinyconfig
          elif [ "${{ inputs.build-type }}" = "defconfig" ]; then
            echo "Using defconfig (default kernel config)"
            make O="$BUILD_DIR" defconfig
          else
            echo "Using localmodconfig (optimized for target hardware)"
            # Process config in temporary location first
            if [ -f "$TEMP_CONFIG" ]; then
              echo "✅ Processing config from temporary location"
              echo "Temp config size: $(wc -l < "$TEMP_CONFIG") lines"
              
              # Copy to a working location for modifications
              WORK_CONFIG="/tmp/work-kernel-config"
              cp "$TEMP_CONFIG" "$WORK_CONFIG"
              
              # Apply all modifications to the working config
              echo "🚀 Applying build optimizations to working config..."
              scripts/config --file "$WORK_CONFIG" --enable CONFIG_TRIM_UNUSED_KSYMS
              
              if [ "${{ inputs.enable-debug }}" != "true" ]; then
                echo "Disabling debug features for faster builds..."
                scripts/config --file "$WORK_CONFIG" --disable CONFIG_DEBUG_INFO
                scripts/config --file "$WORK_CONFIG" --disable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
                scripts/config --file "$WORK_CONFIG" --disable CONFIG_DEBUG_KERNEL
                scripts/config --file "$WORK_CONFIG" --disable CONFIG_DEBUG_MISC
                scripts/config --file "$WORK_CONFIG" --disable CONFIG_DEBUG_VM
                scripts/config --file "$WORK_CONFIG" --disable CONFIG_DEBUG_PAGEALLOC
                scripts/config --file "$WORK_CONFIG" --disable CONFIG_DEBUG_SLUB
                scripts/config --file "$WORK_CONFIG" --disable CONFIG_LOCKDEP
                scripts/config --file "$WORK_CONFIG" --disable CONFIG_PROVE_LOCKING
                scripts/config --file "$WORK_CONFIG" --disable CONFIG_DEBUG_LOCK_ALLOC
              fi
              
              scripts/config --file "$WORK_CONFIG" --enable CONFIG_CC_OPTIMIZE_FOR_SIZE
              scripts/config --file "$WORK_CONFIG" --enable CONFIG_MODULES
              scripts/config --file "$WORK_CONFIG" --enable CONFIG_MODULE_UNLOAD
              
              echo "🔧 Clearing Debian-specific certificate paths..."
              scripts/config --file "$WORK_CONFIG" --set-str CONFIG_SYSTEM_TRUSTED_KEYS ""
              scripts/config --file "$WORK_CONFIG" --set-str CONFIG_SYSTEM_REVOCATION_KEYS ""
              
              # First, run olddefconfig in a temporary directory to generate full config
              echo "📊 Generating full config with olddefconfig in temp directory..."
              TEMP_BUILD_DIR="/tmp/temp-config-build"
              mkdir -p "$TEMP_BUILD_DIR"
              cp "$WORK_CONFIG" "$TEMP_BUILD_DIR/.config"
              
              # Run olddefconfig in temp directory to generate fully expanded config
              KBUILD_BUILD_TIMESTAMP='' make O="$TEMP_BUILD_DIR" CC="ccache gcc" olddefconfig
              
              # Now check if the config has actually changed
              echo "📊 Comparing fully expanded configs to determine if update needed..."
              CONFIG_CHANGED=0
              if [ -f "$BUILD_DIR/.config" ]; then
                # Normalize both configs before comparison (sort and remove comments)
                grep -v '^#' "$TEMP_BUILD_DIR/.config" | grep -v '^$' | sort > /tmp/new-config-normalized
                grep -v '^#' "$BUILD_DIR/.config" | grep -v '^$' | sort > /tmp/old-config-normalized
                
                if diff -q /tmp/new-config-normalized /tmp/old-config-normalized > /dev/null 2>&1; then
                  echo "✅ Config unchanged - preserving existing build directory cache"
                  echo "📁 Using existing .config from cached build directory"
                  CONFIG_CHANGED=0
                else
                  echo "🔄 Config has changed - updating build directory"
                  echo "📊 Brief summary of differences:"
                  diff -u /tmp/old-config-normalized /tmp/new-config-normalized | head -20 || true
                  cp "$TEMP_BUILD_DIR/.config" "$BUILD_DIR/.config"
                  echo "📝 Config updated in build directory with fully expanded config"
                  CONFIG_CHANGED=1
                fi
                rm -f /tmp/new-config-normalized /tmp/old-config-normalized
              else
                echo "📝 No existing config - copying expanded config to build directory"
                cp "$TEMP_BUILD_DIR/.config" "$BUILD_DIR/.config"
                CONFIG_CHANGED=1
              fi
              
              # Clean up temp directory
              rm -rf "$TEMP_BUILD_DIR"
              
              # Report cache impact
              if [ "$CONFIG_CHANGED" -eq 0 ]; then
                echo ""
                echo "🎯 CACHE OPTIMIZATION SUCCESS"
                echo "============================="
                echo "✅ Config is identical to cached version"
                echo "✅ Build directory cache will be fully utilized"
                echo "⚡ Expect significantly faster build times"
                echo "📝 No olddefconfig needed in build directory - preserving cache!"
              else
                echo ""
                echo "⚠️  CACHE UPDATE REQUIRED"
                echo "========================"
                echo "📝 Config has been updated with new settings"
                echo "🔄 Build directory cache may be partially invalidated"
                echo "⏱️  Build time may increase for changed components"
              fi
              
              rm -f "$WORK_CONFIG"
            else
              echo "❌ ERROR: No temp config file found"
              exit 1
            fi
          fi
          
          echo ""
          echo "📋 Final kernel configuration:"
          echo "  - Kernel version: $(KBUILD_BUILD_TIMESTAMP='' make -s O="$BUILD_DIR" CC="ccache gcc" kernelrelease)"
          echo "  - Modules enabled: $(grep -c "=m$" "$BUILD_DIR/.config" || echo 0)"
          echo "  - Built-in features: $(grep -c "=y$" "$BUILD_DIR/.config" || echo 0)"
          echo "  - Debug features: $(grep -c "CONFIG_DEBUG.*=y$" "$BUILD_DIR/.config" || echo 0)"

      - name: Build kernel bzImage
        run: |
          echo "🔨 Starting kernel bzImage build..."
          echo "Using $(nproc) CPU cores for parallel compilation"
          echo "Build directory: $BUILD_DIR"
          echo "Target: bzImage (compressed bootable kernel)"
          
          START_TIME=$(date +%s)
          KBUILD_BUILD_TIMESTAMP='' make O="$BUILD_DIR" CC="ccache gcc" -j$(($(nproc) + 1)) bzImage 2>&1 | tee build.log
          
          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))
          echo "BUILD_TIME=${BUILD_TIME}" >> $GITHUB_ENV
          echo "⏰ bzImage build completed in ${BUILD_TIME} seconds ($((BUILD_TIME / 60))m $((BUILD_TIME % 60))s)"
          
          echo "📊 ccache statistics:"
          ccache -s

      - name: Build modules
        run: |
          echo "🔧 Building kernel modules..."
          START_TIME=$(date +%s)
          
          KBUILD_BUILD_TIMESTAMP='' make O="$BUILD_DIR" CC="ccache gcc" -j$(($(nproc) + 1)) modules 2>&1 | tee -a build.log
          
          END_TIME=$(date +%s)
          MODULE_TIME=$((END_TIME - START_TIME))
          echo "MODULE_TIME=${MODULE_TIME}" >> $GITHUB_ENV
          echo "⏰ Module build completed in ${MODULE_TIME} seconds ($((MODULE_TIME / 60))m $((MODULE_TIME % 60))s)"

      - name: Build initrd with dracut
        run: |
          echo "🔧 Building initrd with dracut..."
          
          mkdir -p artifacts
          
          KERNEL_VERSION=$(KBUILD_BUILD_TIMESTAMP='' make -s O="$BUILD_DIR" CC="ccache gcc" kernelrelease)
          echo "Kernel version: ${KERNEL_VERSION}"
          
          MODULES_STAGING="$HOME/kernel-modules-staging"
          echo "Installing already-built modules to staging directory..."
          echo "Target directory: ${MODULES_STAGING}"
          
          KBUILD_BUILD_TIMESTAMP='' make O="$BUILD_DIR" INSTALL_MOD_PATH="${MODULES_STAGING}" INSTALL_MOD_STRIP=1 CC="ccache gcc" modules_install
          
          MODULES_DIR="${MODULES_STAGING}/lib/modules/${KERNEL_VERSION}"
          echo "Expected modules directory: ${MODULES_DIR}"
          
          if [ ! -d "${MODULES_DIR}" ]; then
            echo "❌ Modules directory not found: ${MODULES_DIR}"
            exit 1
          fi
          
          echo "✅ Modules installed successfully:"
          echo "  - Module count: $(find "${MODULES_DIR}" -name "*.ko" | wc -l)"
          echo "  - Directory size: $(du -sh "${MODULES_DIR}" | cut -f1)"
          
          echo "Creating portable initrd with dracut..."
          AWS_DRIVERS="ena virtio_net virtio_blk nvme ixgbevf virtio_scsi"
          
          echo "Including AWS/cloud drivers: ${AWS_DRIVERS}"
          dracut --no-hostonly \
                 --kmoddir "${MODULES_DIR}" \
                 --add-drivers "${AWS_DRIVERS}" \
                 --force \
                 "artifacts/initrd.img" \
                 "${KERNEL_VERSION}"
          
          if [ -f "artifacts/initrd.img" ]; then
            echo "✅ Initrd created successfully:"
            echo "  - Size: $(du -h artifacts/initrd.img | cut -f1)"
            sha256sum artifacts/initrd.img > artifacts/initrd.sha256
            echo "  - SHA256: $(cat artifacts/initrd.sha256)"
          else
            echo "❌ Failed to create initrd"
            exit 1
          fi

      - name: Prepare kernel artifacts
        run: |
          echo "📦 Preparing kernel artifacts..."
          mkdir -p artifacts
          
          # Copy kernel images from build directory
          if [ -f "$BUILD_DIR/arch/x86/boot/bzImage" ]; then
            cp "$BUILD_DIR/arch/x86/boot/bzImage" artifacts/
            echo "✅ bzImage: $(du -h "$BUILD_DIR/arch/x86/boot/bzImage" | cut -f1)"
          else
            echo "⚠️ bzImage not found in $BUILD_DIR/arch/x86/boot/"
          fi
          
          if [ -f "$BUILD_DIR/vmlinux" ]; then
            cp "$BUILD_DIR/vmlinux" artifacts/
            echo "✅ vmlinux: $(du -h "$BUILD_DIR/vmlinux" | cut -f1)"
          else
            echo "⚠️ vmlinux not found in $BUILD_DIR"
          fi
          
          if [ -f "$BUILD_DIR/System.map" ]; then
            cp "$BUILD_DIR/System.map" artifacts/
            echo "✅ System.map: $(du -h "$BUILD_DIR/System.map" | cut -f1)"
          else
            echo "⚠️ System.map not found in $BUILD_DIR"
          fi
          
          # Copy config from build directory
          cp "$BUILD_DIR/.config" artifacts/kernel-config
          
          # Archive modules from build directory
          if [ "$(find "$BUILD_DIR" -name "*.ko" | wc -l)" -gt 0 ]; then
            echo "📦 Creating modules archive..."
            cd "$BUILD_DIR"
            find . -name "*.ko" -exec cp --parents {} "$GITHUB_WORKSPACE/artifacts/" \;
            cd "$GITHUB_WORKSPACE"
            MODULE_COUNT=$(find artifacts -name "*.ko" | wc -l)
            echo "✅ Modules archived: $MODULE_COUNT"
          fi
          
          cat > artifacts/build-summary.txt << EOF
          Linux Kernel Build Summary
          =========================
          Build Date: $(date)
          Build Type: ${{ inputs.build-type || 'localmod' }}
          Build Instance Type: ${{ inputs.build-instance-type || 'm7i.metal-24xl' }}
          Test Instance Type: ${{ inputs.instance-type || 'm7i.metal-24xl' }}
          Target Image: ${{ inputs.image-type || 'ubuntu-24.04' }}
          Debug Features: ${{ inputs.enable-debug || 'false' }}
          
          Kernel Version: $(KBUILD_BUILD_TIMESTAMP='' make -s O="$BUILD_DIR" CC="ccache gcc" kernelrelease)
          Compiler: $(gcc --version | head -1)
          
          Configuration Stats:
          - Total modules: $(grep -c "=m$" .config || echo 0)
          - Built-in features: $(grep -c "=y$" .config || echo 0)
          - Disabled features: $(grep -c "is not set$" .config || echo 0)
          
          Build Performance:
          - Runner CPUs: $(nproc)
          - Parallel jobs: $(($(nproc) + 1))
          
          ccache Statistics:
          $(ccache -s)
          EOF
          
          echo "📋 Artifact summary:"
          ls -la artifacts/
          echo ""
          echo "Total artifact size: $(du -sh artifacts | cut -f1)"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-kernel-${{ inputs.build-type || 'localmod' }}-${{ inputs.build-instance-type || 'm7i.metal-24xl' }}-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          compression-level: 6

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ inputs.build-type || 'localmod' }}-${{ github.sha }}
          path: build.log
          retention-days: 14

      - name: Generate release information
        id: release_info
        run: |
          echo "🚀 Preparing release information..."
          
          RELEASE_TAG="resctrl-perf-$(date -u +%Y%m%d-%H%M%S)"
          KERNEL_VERSION=$(KBUILD_BUILD_TIMESTAMP='' make -s O="$BUILD_DIR" CC="ccache gcc" kernelrelease)
          
          echo "📋 Release details:"
          echo "  Tag: $RELEASE_TAG"
          echo "  Kernel version: $KERNEL_VERSION"
          echo "  Build type: ${{ inputs.build-type || 'localmod' }}"
          echo "  Build instance type: ${{ inputs.build-instance-type || 'm7i.metal-24xl' }}"
          echo "  Test instance type: ${{ inputs.instance-type || 'm7i.metal-24xl' }}"
          echo "  Image type: ${{ inputs.image-type || 'ubuntu-24.04' }}"
          
          cat > release-notes.md << EOF
          # Resctrl PMU Kernel Build - $RELEASE_TAG
          
          Custom Linux kernel build with resctrl PMU support for cache occupancy monitoring via perf counters.
          
          ## Build Information
          - **Kernel Version**: $KERNEL_VERSION
          - **Build Type**: ${{ inputs.build-type || 'localmod' }}
          - **Build Instance**: ${{ inputs.build-instance-type || 'm7i.metal-24xl' }}
          - **Test Instance**: ${{ inputs.instance-type || 'm7i.metal-24xl' }}
          - **Target Image**: ${{ inputs.image-type || 'ubuntu-24.04' }}
          - **Git Commit**: ${{ github.sha }}
          - **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ## Assets Included
          - **bzImage**: Bootable kernel image
          - **vmlinux**: Uncompressed kernel image (for debugging)
          - **System.map**: Kernel symbol map
          - **initrd.img**: Initial ramdisk with AWS/cloud drivers
          - **initrd.sha256**: SHA256 checksum for initrd verification
          - **kernel-config**: Kernel configuration used for this build
          - **build-summary.txt**: Detailed build information and statistics
          - **resctrl_tests**: Compiled test binary for resctrl functionality
          - **modules archive**: All kernel modules (if any were built)
          
          ## Test Results
          This kernel will be automatically tested on EC2 instance type: ${{ inputs.instance-type || 'm7i.metal-24xl' }}
          EOF
          
          if [ "$(find artifacts -name "*.ko" 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "📦 Creating modules archive..."
            cd artifacts
            tar -czf "modules-${KERNEL_VERSION}.tar.gz" $(find . -name "*.ko")
            cd ..
            echo "✅ modules archive created: modules-${KERNEL_VERSION}.tar.gz"
          fi
          
          echo "🧪 Building resctrl tests for release..."
          if [ -d "tools/testing/selftests/resctrl" ]; then
            cd tools/testing/selftests/resctrl
            make clean && make
            if [ -f "resctrl_tests" ]; then
              cp resctrl_tests ../../../../artifacts/
              echo "✅ resctrl_tests built"
            else
              echo "⚠️ resctrl_tests build failed"
            fi
            cd ../../../..
          else
            echo "⚠️ resctrl test directory not found"
          fi
          
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "release_name=Resctrl PMU Kernel - $KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "kernel_version=$KERNEL_VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.release_info.outputs.release_tag }}
          name: ${{ steps.release_info.outputs.release_name }}
          bodyFile: release-notes.md
          artifacts: |
            artifacts/bzImage
            artifacts/vmlinux
            artifacts/System.map
            artifacts/kernel-config
            artifacts/build-summary.txt
            artifacts/initrd.img
            artifacts/initrd.sha256
            artifacts/modules-*.tar.gz
            artifacts/resctrl_tests
          artifactErrorsFailBuild: false
          makeLatest: true
          token: ${{ github.token }}

      - name: Build completion summary
        run: |
          echo ""
          echo "🎯 KERNEL BUILD COMPLETED SUCCESSFULLY!"
          echo "======================================"
          echo "✅ Kernel version: $(KBUILD_BUILD_TIMESTAMP='' make -s O="$BUILD_DIR" CC="ccache gcc" kernelrelease)"
          echo "✅ Build type: ${{ inputs.build-type || 'localmod' }}"
          echo "✅ GitHub release created: ${{ steps.release_info.outputs.release_tag }}"
          echo ""
          echo "📊 CACHE PERFORMANCE METRICS"
          echo "============================"
          echo "🔧 ccache final statistics:"
          ccache -s | grep -E "Hits:|Misses:|Hit rate:" || ccache -s | grep -E "cache hit|cache miss|Primary storage"
          echo ""
          echo "📦 Build directory cache:"
          if [ "${{ steps.cache-build.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Cache was HIT - saved significant build time"
          else
            echo "📝 Cache was MISS - populated for next build"
          fi
          echo "Build directory size: $(du -sh $BUILD_DIR | cut -f1)"
          echo ""
          echo "⏱️ Build time impact:"
          echo "  - Kernel build: $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"
          echo "  - Module build: $((MODULE_TIME / 60))m $((MODULE_TIME % 60))s" 
          echo "  - Total build: $(( (BUILD_TIME + MODULE_TIME) / 60 ))m $(( (BUILD_TIME + MODULE_TIME) % 60 ))s"
          echo ""
          echo "💡 Tip: Incremental builds with cache hits can be 70-90% faster!"
          echo ""
          echo "📦 Now proceeding to test on EC2 instance..."
          echo ""

  # Use reusable workflow to get a runner with custom kernel
  get-test-runner:
    name: Get Test Runner with Custom Kernel
    needs: build-kernel
    uses: ./.github/workflows/runner-with-kernel.yml
    with:
      kernel-release-tag: ${{ needs.build-kernel.outputs.release-tag }}
      instance-type: ${{ inputs.instance-type || 'm7i.metal-24xl' }}
      image-type: ${{ inputs.image-type || 'ubuntu-24.04' }}
      runner-timeout-minutes: 30
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
      repo-admin-token: ${{ secrets.REPO_ADMIN_TOKEN }}

  # Run tests on the custom kernel runner
  pmu-test:
    name: Run PMU Tests on Custom Kernel
    needs: [get-test-runner, build-kernel]
    runs-on: ${{ needs.get-test-runner.outputs.runner-label }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/testing/selftests/resctrl/
          sparse-checkout-cone-mode: false
      
      - name: Verify custom kernel boot
        run: |
          echo "================================================"
          echo "🚀 CUSTOM KERNEL SUCCESSFULLY BOOTED! 🚀"
          echo "================================================"
          echo ""
          echo "📍 Kernel version: $(uname -r)"
          echo "📍 Expected version: ${{ needs.get-test-runner.outputs.kernel-version }}"
          echo "📍 Tested release: ${{ needs.build-kernel.outputs.release-tag }}"
          echo "⏰ System uptime: $(uptime)"
          echo "📅 Date: $(date)"
          echo ""
          
      - name: Check resctrl support
        run: |
          echo "🔍 Checking resctrl support in custom kernel..."
          
          if [[ -d /sys/fs/resctrl ]]; then
            echo "✅ /sys/fs/resctrl exists"
            
            if ! mount | grep -q resctrl; then
              echo "Mounting resctrl filesystem..."
              mount -t resctrl resctrl /sys/fs/resctrl || true
            fi
            
            echo "📁 Contents of /sys/fs/resctrl:"
            ls -la /sys/fs/resctrl/ || true
            
            if [[ -d /sys/fs/resctrl/info ]]; then
              echo ""
              echo "📊 Resctrl info:"
              find /sys/fs/resctrl/info -type f | while read file; do
                echo "📄 $file: $(cat "$file" 2>/dev/null || echo 'read error')"
              done
            fi
          else
            echo "❌ /sys/fs/resctrl not found"
          fi
          
          echo ""
          echo "🔧 Kernel configuration for resctrl:"
          if [[ -f /proc/config.gz ]]; then
            zcat /proc/config.gz | grep -E "(RESCTRL|RDT)" || echo "No resctrl config found"
          else
            echo "Kernel config not available"
          fi
          
          echo ""
          echo "📋 Kernel messages about resctrl:"
          dmesg | grep -i resctrl | head -20 || echo "No resctrl messages"
          
      - name: Download test binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "📦 Downloading test binary from release: ${{ needs.build-kernel.outputs.release-tag }}"
          
          RELEASE_TAG="${{ needs.build-kernel.outputs.release-tag }}"
          
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "❌ No release tag provided"
            exit 1
          fi
          
          echo "Downloading from release: $RELEASE_TAG"
          
          if gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --pattern "resctrl_tests" --output ./resctrl_tests; then
            echo "✅ Test binary downloaded"
            chmod +x ./resctrl_tests
            ls -la ./resctrl_tests
          else
            echo "❌ Failed to download test binary from release $RELEASE_TAG"
            exit 1
          fi
          
      - name: Run PMU test
        id: run_pmu_test
        continue-on-error: true
        run: |
          echo "🧪 Running resctrl PMU test..."
          echo "Testing kernel from release: ${{ needs.build-kernel.outputs.release-tag }}"
          
          ./resctrl_tests -t pmu
          
      - name: Capture test results
        if: always()
        run: |
          echo "📊 Test Results Summary"
          echo "======================="
          echo "Tested release: ${{ needs.build-kernel.outputs.release-tag }}"
          echo "Kernel version: ${{ needs.get-test-runner.outputs.kernel-version }}"
          echo "Test exit code: ${{ steps.run_pmu_test.outcome }}"
          
          echo ""
          echo "🔍 Full kernel messages (dmesg):"
          echo "================================"
          dmesg
          
          echo ""
          echo "🎯 PMU-related kernel messages (filtered):"
          echo "=========================================="
          dmesg | grep -i -E "(pmu|perf|resctrl|rdt|WARN|WARNING|BUG)" || echo "No PMU messages"
          
          echo ""
          echo "⚠️ WARN_ONCE messages (if any):"
          echo "================================"
          dmesg | grep -E "WARNING:|WARN_ONCE" || echo "No WARN_ONCE messages found"
          
      - name: Fail if test failed
        if: steps.run_pmu_test.outcome == 'failure'
        run: |
          echo "❌ PMU test failed!"
          exit 1

  # Always cleanup resources
  cleanup:
    name: Cleanup Resources
    needs: [get-test-runner, pmu-test, build-kernel]
    if: always()
    uses: ./.github/workflows/runner-cleanup.yml
    with:
      runner-label: ${{ needs.get-test-runner.outputs.runner-label }}
      ec2-instance-id: ${{ needs.get-test-runner.outputs.ec2-instance-id }}
      region: ${{ needs.get-test-runner.outputs.region }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
      repo-admin-token: ${{ secrets.REPO_ADMIN_TOKEN }}